<!doctype html>
<html lang="en" style="background-color: var(--v2-background-bg-deep, #fafafa)">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Moon Code</title>
  <link rel="icon" type="image/png" href="/logo.png" sizes="96x96" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#fafafa" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
  </style>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="antialiased overscroll-none overflow-hidden" style="background-color: var(--v2-background-bg-deep);">
  <!-- Update banner -->
  <div id="update-banner" class="update-banner" hidden>
    <div class="update-banner-content">
      <span class="update-icon">⚡</span>
      <div class="update-text">
        <strong id="update-title">Update Available</strong>
        <span id="update-detail"></span>
      </div>
      <button id="update-btn" class="update-btn" onclick="installUpdate()">Update</button>
      <button class="update-dismiss" onclick="dismissUpdate()">×</button>
    </div>
  </div>

  <div id="root" class="app-root">
    <!-- Tab bar -->
    <div id="tab-bar" class="tab-bar"></div>

    <!-- Main layout: sidebar + chat + inspector -->
    <div class="app-layout">
      <!-- Left sidebar: sessions list -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="sidebar-new-session" onclick="newSession()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            <span>New Session</span>
          </button>
        </div>
        <div class="sidebar-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Search sessions..." oninput="filterSessions(this.value)" />
        </div>
        <div class="sidebar-sessions" id="session-list"></div>
        <div class="sidebar-footer">
          <div class="sidebar-status">
            <span class="status-dot"></span>
            <span class="status-text">Ready</span>
          </div>
        </div>
      </aside>

      <!-- Main chat area -->
      <main class="chat-area">
        <header class="chat-header">
          <div class="chat-header-left">
            <h1 class="chat-title" id="chat-title">New Session</h1>
            <span class="chat-mode" id="chat-mode">build</span>
          </div>
          <div class="chat-header-right">
            <button class="header-btn" onclick="shareSession()" title="Share">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
            </button>
            <button class="header-btn" onclick="forkCurrentSession()" title="Fork">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M6 9v3a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V9"/></svg>
            </button>
            <div class="usage-pill" id="usage-pill" style="display:none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              <span id="usage-text">0</span>
            </div>
          </div>
        </header>

        <div class="chat-messages" id="chat-messages">
          <div class="chat-welcome" id="chat-welcome">
            <div class="welcome-icon">
              <img src="/logo.png" alt="Moon Code" width="48" height="48" style="border-radius:12px;" />
            </div>
            <h2>How can I help you today?</h2>
            <p>Ask me to write code, fix bugs, explain concepts, or design interfaces.</p>
            <div class="welcome-suggestions">
              <button class="suggestion-card" onclick="sendSuggestion('Analyze the project structure and suggest improvements')">
                <div class="suggestion-icon">📊</div>
                <div>
                  <strong>Analyze project</strong>
                  <small>Get structure overview and suggestions</small>
                </div>
              </button>
              <button class="suggestion-card" onclick="sendSuggestion('Fix common issues in the codebase')">
                <div class="suggestion-icon">🔧</div>
                <div>
                  <strong>Fix issues</strong>
                  <small>Auto-detect and fix common problems</small>
                </div>
              </button>
              <button class="suggestion-card" onclick="sendSuggestion('Design a responsive landing page')">
                <div class="suggestion-icon">🎨</div>
                <div>
                  <strong>Design artifact</strong>
                  <small>Create HTML/CSS/JS interfaces</small>
                </div>
              </button>
            </div>
          </div>
        </div>

        <!-- Approval dock -->
        <div class="approval-dock" id="approval-dock" hidden>
          <div class="approval-card">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>
            <div class="approval-info">
              <strong id="approval-title">Approval needed</strong>
              <code id="approval-detail"></code>
            </div>
            <div class="approval-actions">
              <button class="btn-danger" onclick="respondApproval('deny')">Deny</button>
              <button class="btn-primary" onclick="respondApproval('approve')">Allow</button>
            </div>
          </div>
        </div>

        <!-- Composer -->
        <div class="composer-area">
          <div class="composer" id="composer">
            <textarea id="composer-input" placeholder="Ask Moon Code anything..." rows="1"
              oninput="autoResize(this)" onkeydown="handleComposerKey(event)"></textarea>
            <div class="composer-footer">
              <div class="composer-left">
                <button class="composer-btn" onclick="toggleMode()" id="mode-btn">
                  <span class="mode-icon">⚡</span>
                  <span id="mode-text">build</span>
                </button>
                <button class="composer-btn" onclick="attachImage()" title="Attach image">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
              </div>
              <div class="composer-right">
                <span class="shortcut-hint">⏎ Send</span>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Right inspector panel -->
      <aside class="inspector" id="inspector">
        <div class="inspector-tabs">
          <button class="inspector-tab is-active" onclick="switchInspectorTab('files', this)">Files</button>
          <button class="inspector-tab" onclick="switchInspectorTab('preview', this)">Preview</button>
          <button class="inspector-tab" onclick="switchInspectorTab('changes', this)">Changes</button>
        </div>
        <div class="inspector-content" id="inspector-content">
          <div class="inspector-view is-active" id="inspector-files">
            <div class="file-tree" id="file-tree"></div>
          </div>
          <div class="inspector-view" id="inspector-preview">
            <div class="preview-empty">
              <p>No preview available</p>
            </div>
          </div>
          <div class="inspector-view" id="inspector-changes">
            <div class="changes-empty">
              <p>No changes yet</p>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Settings dialog -->
  <dialog id="settings-dialog" class="settings-dialog">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="settings-close" onclick="document.getElementById('settings-dialog').close()">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <h3>Provider</h3>
        <select id="settings-provider" onchange="saveProvider(this.value)">
          <option value="demo">Demo (offline)</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="google">Google</option>
          <option value="openrouter">OpenRouter</option>
          <option value="ollama">Ollama (local)</option>
        </select>
      </div>
      <div class="settings-section">
        <h3>Model</h3>
        <input type="text" id="settings-model" placeholder="e.g. gpt-5-mini" onblur="saveModel(this.value)" />
      </div>
      <div class="settings-section">
        <h3>API Key</h3>
        <input type="password" id="settings-apikey" placeholder="sk-..." onblur="saveApiKey(this.value)" />
      </div>
      <div class="settings-section" id="theme-section">
        <h3>Theme</h3>
        <div class="theme-grid" id="theme-grid"></div>
      </div>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
