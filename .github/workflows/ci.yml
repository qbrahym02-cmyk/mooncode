# ════════════════════════════════════════════════════════════════════════════
# Zetora CI — continuous integration for every push and pull request
# ════════════════════════════════════════════════════════════════════════════
# Runs on: Node.js 20.12 and 22 (LTS)
# Steps:  checkout → syntax check → tests → build Docker image
# ════════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Syntax + Tests ─────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.12, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Node version >= 20.12
        run: node -e "const v=process.versions.node;const[major,minor]=v.split('.').map(Number);if(major<20||(major===20&&minor<12)){console.error('Node '+v+' is too old. Need >=20.12');process.exit(1)}console.log('Node '+v+' OK')"

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Verify environment validation
        run: node scripts/ops.mjs env:validate

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            .zetora/audit.ndjson
          retention-days: 7
          if-no-files-found: ignore

  # ─── Security Scan ──────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          # Basic check: fail if any .env file (other than .env.example) is committed.
          if find . -name ".env" -not -path "./.git/*" -not -name ".env.example" | grep -q .; then
            echo "::error::Found a committed .env file. This is a security risk."
            find . -name ".env" -not -path "./.git/*" -not -name ".env.example"
            exit 1
          fi
          echo "No committed .env files found."

      - name: Check .gitignore covers secrets
        run: |
          if ! grep -q "^\.env$" .gitignore; then
            echo "::error::.gitignore does not exclude .env"
            exit 1
          fi
          echo ".gitignore correctly excludes .env"

      - name: Check for private keys
        run: |
          # Fail if any actual private key block appears in tracked files.
          # Exclude: test fixtures, the secret-detection module itself (which
          # contains the pattern as a string), docs, and .github workflows.
          EXCLUDES="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=.github"
          EXCLUDES="$EXCLUDES --exclude=secrets.js --exclude=security.test.js --exclude=*.md"
          # Match actual PEM blocks (header + base64 + footer on separate lines).
          if grep -rzP "-----BEGIN [A-Z ]*PRIVATE KEY-----\n[A-Za-z0-9+/=\n]+-----END [A-Z ]*PRIVATE KEY-----" \
              --include="*.js" --include="*.ts" --include="*.json" $EXCLUDES . ; then
            echo "::error::Found an actual private key in tracked files."
            exit 1
          fi
          echo "No actual private keys found in source."

  # ─── Docker Build ───────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: false
          tags: zetora:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify image starts
        run: |
          docker run --rm -d --name zetora-test -p 4173:4173 zetora:ci-${{ github.sha }}
          sleep 5
          # Health check
          if curl -sf http://127.0.0.1:4173/api/health | grep -q "ok"; then
            echo "Server is healthy"
          else
            echo "::error::Server health check failed"
            docker logs zetora-test
            exit 1
          fi
          docker stop zetora-test

  # ─── Release (only on main, only on version tags) ───────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Zetora v${{ steps.version.outputs.version }}
          body_path: docs/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
