# ════════════════════════════════════════════════════════════════════════════
# Zetora Release — builds and publishes CLI binaries + desktop apps
# ════════════════════════════════════════════════════════════════════════════
# Triggers when a tag matching v* is pushed.
#
# Builds:
#   1. CLI binaries (standalone Node.js bundles) for macOS/Linux/Windows
#   2. Desktop apps (Electron) for macOS (dmg+zip), Windows (nsis+portable), Linux (AppImage+deb)
#
# Uploads all artifacts to the GitHub Release.
# ════════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v prefix)"
        required: true
        default: "0.9.2"

permissions:
  contents: write

jobs:
  # ─── CLI Binaries (standalone Node.js bundles) ───────────────────────────
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-x64
            runner: macos-13
          - os: macos-arm64
            runner: macos-14
          - os: linux-x64
            runner: ubuntu-latest
          - os: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify tests pass
        if: runner.os != 'Windows'
        run: npm test
        env:
          NODE_ENV: test

      - name: Bundle CLI into standalone package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          ASSET_NAME="zetora-${VERSION}-${{ matrix.os }}"
          echo "Building ${ASSET_NAME}"

          # Create the bundle directory.
          mkdir -p "${ASSET_NAME}/apps"
          cp -r apps/cli/src "${ASSET_NAME}/cli-src"
          cp -r packages "${ASSET_NAME}/packages"
          cp -r apps/server "${ASSET_NAME}/apps/server"
          cp -r apps/tui "${ASSET_NAME}/apps/tui"
          cp -r apps/web "${ASSET_NAME}/apps/web"
          cp package.json "${ASSET_NAME}/"
          cp .env.example "${ASSET_NAME}/" 2>/dev/null || true
          cp brand.json "${ASSET_NAME}/" 2>/dev/null || true

          # Move cli-src to apps/cli/src structure.
          mkdir -p "${ASSET_NAME}/apps/cli"
          mv "${ASSET_NAME}/cli-src" "${ASSET_NAME}/apps/cli/src"

          if [[ "${{ matrix.os }}" == windows-* ]]; then
            printf '@echo off\r\nnode "%%~dp0apps\\cli\\src\\cli.js" %%*\r\n' > "${ASSET_NAME}/zetora.cmd"
            7z a -tzip "dist/${ASSET_NAME}.zip" "${ASSET_NAME}"
          else
            printf '#!/usr/bin/env bash\nDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\nexec node "$DIR/apps/cli/src/cli.js" "$@"\n' > "${ASSET_NAME}/zetora"
            chmod +x "${ASSET_NAME}/zetora"
            tar -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          fi

          echo "Built artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: dist/*

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ─── Desktop Apps (Electron) ─────────────────────────────────────────────
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron dependencies
        shell: bash
        run: |
          cd apps/desktop
          npm install --ignore-scripts 2>&1 | tail -5 || true

      - name: Build & package desktop app
        shell: bash
        run: |
          cd apps/desktop
          # Only build for the current OS to avoid cross-compilation issues.
          npx electron-builder --${{ matrix.os }} --publish never 2>&1 | tail -20 || echo "electron-builder failed (expected if no signing keys)"
          ls -lh dist/ 2>/dev/null || echo "No dist output"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/dist/*
          if-no-files-found: warn

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.tar.gz
